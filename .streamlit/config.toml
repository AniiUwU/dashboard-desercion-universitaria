[theme]
# Color principal (para texto destacado y gráficos)
primaryColor = "#FF6699"

# Color de fondo principal (¡Ahora sí, un rosado pastel muy suave!)
backgroundColor = "#FFF0F5"

# Color de fondo secundario (rosado un poquito más oscuro para contrastar)
secondaryBackgroundColor = "#FFE6F2"

# Color del texto (un gris oscuro para que sea fácil de leer)
textColor = "#4A4A4A"

# Tipo de fuente
font = "sans serif"
